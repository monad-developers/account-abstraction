services:
  test:
    image: node:24
    container_name: gascalc
    depends_on:
      localgeth:
        condition: service_healthy
    volumes:
      - ..:/app
    working_dir: /app
    restart: "no"
    environment:
      - HARDHAT_NETWORK=localgeth
    command: "yarn mocha-gascalc"

  localgeth:
    ports: [ '8545:8545' ]
    image: ethereum/client-go:release-1.14
    healthcheck:
      test: ["CMD", "geth", "attach", "--exec", "eth.blockNumber", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      start_period: 10s
      retries: 30
    volumes:
      - ./geth-genesis.json:/genesis.json:ro
    entrypoint: sh
    command:
      - -c
      - >
        echo ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 > /key.txt &&
        : > /pw.txt &&
        geth --lightkdf --datadir /d account import --password /pw.txt /key.txt > /dev/null 2>&1 &&
        geth --datadir /d init /genesis.json &&
        exec geth --lightkdf --datadir /d --verbosity 1
        --http --http.addr 0.0.0.0 --http.api 'eth,net,web3,debug' --http.port 8545
        --http.vhosts '*,localhost,host.docker.internal'
        --dev --rpc.allow-unprotected-txs
